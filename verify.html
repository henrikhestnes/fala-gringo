<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#009c3b">
<title>Data checks — Fala Gringo</title>
<link rel="stylesheet" href="css/app.css">
<style>
  main { max-width: 820px; }
  .check { border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-sm);
           padding:.6rem .8rem; margin-bottom:.4rem; display:flex; gap:.6rem; align-items:baseline; }
  .check .mark { font-family:var(--mono); font-weight:700; flex:none; }
  .check.pass .mark { color:var(--green-ink); }
  .check.fail { border-color:var(--red); background:var(--red-soft); }
  .check.fail .mark { color:var(--red-ink); }
  .check .body { flex:1; min-width:0; }
  .check .name { font-weight:600; font-size:.9rem; }
  .check .detail { font-family:var(--mono); font-size:.76rem; color:var(--text-2);
                   white-space:pre-wrap; margin-top:.25rem; overflow-x:auto; }
  .summary { font-size:1.05rem; font-weight:700; margin:1rem 0; padding:.8rem;
             border-radius:var(--radius-sm); text-align:center; }
  .summary.pass { background:var(--green-soft); color:var(--green-ink); }
  .summary.fail { background:var(--red-soft); color:var(--red-ink); }
</style>
</head>
<body>
<main>
  <div class="view-head">
    <h1>Data checks</h1>
    <p>Runs in the browser — no toolchain, no build step. Open this file directly.</p>
  </div>
  <div id="summary"></div>
  <div id="results"></div>
  <footer><a href="index.html">&larr; Back to the app</a></footer>
</main>

<script src="js/lib/text.js"></script>
<script src="js/conjugate.js"></script>
<script src="js/data/verbs.js"></script>
<script src="js/data/pronominal.js"></script>
<script src="js/data/nouns.js"></script>
<script src="js/data/adjectives.js"></script>
<script src="js/data/adverbs.js"></script>
<script src="js/data/connecting.js"></script>
<script src="js/data/numbers.js"></script>
<script src="js/data/glossary.js"></script>
<script src="js/data/sentences.js"></script>
<script src="js/topics.js"></script>
<script src="js/checks.js"></script>
<script>
const results = runChecks();
const passed = results.filter(r => r.ok).length;
const failed = results.length - passed;

document.getElementById('summary').innerHTML =
  '<div class="summary ' + (failed ? 'fail' : 'pass') + '">' +
  (failed ? '✗ ' + failed + ' of ' + results.length + ' checks failed'
          : '✓ all ' + results.length + ' checks passed') + '</div>';

document.getElementById('results').innerHTML = results.map(r =>
  '<div class="check ' + (r.ok ? 'pass' : 'fail') + '">' +
    '<span class="mark">' + (r.ok ? '✓' : '✗') + '</span>' +
    '<span class="body"><span class="name">' + escapeHtml(r.name) + '</span>' +
      (r.detail ? '<div class="detail">' + escapeHtml(r.detail) + '</div>' : '') +
    '</span></div>').join('');
</script>
</body>
</html>
