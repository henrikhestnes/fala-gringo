<!-- Absolute paths: Cloudflare Pages serves this file for missing URLs at any
     depth, so relative links would break under /verbs/… -->
<link rel="stylesheet" href="/css/app.css">
<style>
  main { text-align: center; padding-top: 4rem; }
  h1 { font-family: var(--display); font-style: italic; font-weight: 700;
    text-transform: uppercase; letter-spacing: .02em; font-size: 3rem;
    margin-bottom: .4rem; }
  p { color: var(--text-2); margin-bottom: 1.4rem; }
  .links a { display: inline-block; background: var(--green); color: #fff;
    text-decoration: none; padding: .55rem 1rem; border-radius: var(--radius-sm);
    font-weight: 600; margin: 0 .3rem; }
  .links a.alt { background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); }
</style>
<script>try{var p=JSON.parse(localStorage.getItem('pvs:v1')||'{}').prefs||{};if(p.theme==='light'||p.theme==='dark')document.documentElement.setAttribute('data-theme',p.theme);}catch(e){}</script>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Essa página não existe, gringo. Mas os verbos continuam te esperando.</p>
  <div class="links">
    <a href="/">Open the app</a>
    <a class="alt" href="/verbs/">All 124 verbs</a>
  </div>
</main>
<footer>Fala Gringo &mdash; Brazilian Portuguese, Rio register.</footer>
</body>
